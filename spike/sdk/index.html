<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台原型</title>
<style>
  :root { --bg: #f6f6f4; --panel: #fff; --ink: #1d1d1b; --quiet: #6b6b66; --line: #e2e2dc; --accent: #2457c5; --warn: #b3261e; --ok: #1f7a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; gap: 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; }
  .meta { color: var(--quiet); font-size: 12px; }
  .state { margin-left: auto; font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); }
  .state.running { color: var(--accent); border-color: var(--accent); }
  .state.stopped { color: var(--warn); border-color: var(--warn); }
  main { max-width: 900px; margin: 0 auto; padding: 16px; padding-bottom: 170px; }
  .ev { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 8px 0; white-space: pre-wrap; word-break: break-word; }
  .ev.user { border-left: 3px solid var(--accent); }
  .ev.tool { font-family: Consolas, monospace; font-size: 12px; color: var(--quiet); }
  .ev.denied { border-color: var(--warn); color: var(--warn); }
  .ev.note { background: transparent; border-style: dashed; color: var(--quiet); font-size: 12px; }
  .ev.error { border-color: var(--warn); color: var(--warn); }
  details { color: var(--quiet); font-size: 12px; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 16px; }
  footer .row { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; min-height: 64px; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .btns { display: flex; flex-direction: column; gap: 6px; }
  .ev.question { border-color: #b45309; background: #fffaf2; white-space: normal; }
  .ev.question.closed { border-color: var(--line); background: var(--panel); opacity: .8; }
  .qhead { font-size: 12px; color: #7a4106; margin-bottom: 6px; }
  .q { margin: 10px 0; }
  .qt { font-weight: 600; margin-bottom: 6px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts button.sel { background: #efe9fd; border-color: #8b7cf6; color: #4c3a9e; }
  .ev.question input { width: 100%; margin-top: 6px; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  .qnote { margin-top: 6px; font-size: 12px; color: var(--quiet); }
</style>
</head>
<body>
<header>
  <h1>工作台原型（阶段 0）</h1>
  <span class="meta" id="ws"></span>
  <span class="state" id="state">未启动</span>
</header>
<main id="log"></main>
<footer>
  <div class="row">
    <textarea id="input" placeholder="输入要求，Ctrl+Enter 发送"></textarea>
    <div class="btns">
      <button class="primary" id="send">发送</button>
      <button id="stop">停止</button>
      <button id="resume">继续</button>
      <button id="new">新会话</button>
    </div>
  </div>
</footer>
<script>
const $ = (id) => document.getElementById(id)
const log = $('log')
let state = 'stopped'
const labels = { stopped: '已停止', starting: '启动中', idle: '空闲', running: '运行中' }
function setState(s) {
  state = s
  $('state').textContent = labels[s] || s
  $('state').className = 'state ' + s
  $('send').disabled = s === 'starting'
  $('stop').disabled = !(s === 'running' || s === 'idle' || s === 'starting')
  $('resume').disabled = s !== 'stopped'
}
function add(cls, text, extra) {
  const div = document.createElement('div')
  div.className = 'ev ' + cls
  div.textContent = text
  if (extra) div.appendChild(extra)
  log.appendChild(div)
  window.scrollTo(0, document.body.scrollHeight)
}
const cards = new Map()
function renderQuestion(m) {
  const div = document.createElement('div')
  div.className = 'ev question'
  const head = document.createElement('div')
  head.className = 'qhead'
  head.textContent = '需要你决定 · 任务在等你回答'
  div.appendChild(head)
  const st = {}
  for (const q of m.questions || []) {
    const s = st[q.id] = { selected: [], custom: '', multi: !!q.multiSelect }
    const box = document.createElement('div')
    box.className = 'q'
    const t = document.createElement('div')
    t.className = 'qt'
    t.textContent = (q.header ? '[' + q.header + '] ' : '') + q.question
    box.appendChild(t)
    const options = q.options || []
    if (options.length) {
      const opts = document.createElement('div')
      opts.className = 'opts'
      for (const o of options) {
        const b = document.createElement('button')
        b.textContent = o.label
        if (o.description) b.title = o.description
        b.onclick = () => {
          if (s.multi) { const i = s.selected.indexOf(o.label); if (i >= 0) s.selected.splice(i, 1); else s.selected.push(o.label) }
          else s.selected = [o.label]
          for (const x of opts.children) x.classList.toggle('sel', s.selected.includes(x.textContent))
        }
        opts.appendChild(b)
      }
      box.appendChild(opts)
    }
    const inp = document.createElement('input')
    inp.placeholder = options.length ? '其他（自己填写，可留空）' : '请填写'
    inp.oninput = () => { s.custom = inp.value.trim() }
    box.appendChild(inp)
    div.appendChild(box)
  }
  const ok = document.createElement('button')
  ok.className = 'primary'
  ok.textContent = '确定'
  ok.onclick = () => {
    const qs = m.questions || []
    // 单选题填了“其他”时以填写为准（selected 为空），与 DSH 的约定一致
    const answers = qs.map((q) => { const s = st[q.id]; const a = { id: q.id, selected: s.multi || !s.custom ? s.selected : [] }; if (s.custom) a.custom = s.custom; return a })
    const summary = qs.map((q) => { const s = st[q.id]; return s.custom || s.selected.join('、') || '（跳过）' }).join('；')
    post('/api/answer', { id: m.id, answers, summary })
  }
  div.appendChild(ok)
  const note = document.createElement('div')
  note.className = 'qnote'
  div.appendChild(note)
  log.appendChild(div)
  cards.set(m.id, div)
  window.scrollTo(0, document.body.scrollHeight)
}
function closeQuestion(m) {
  const d = cards.get(m.id)
  if (!d) return add('note', m.reason)
  d.querySelectorAll('button, input').forEach((x) => { x.disabled = true })
  d.classList.add('closed')
  d.querySelector('.qnote').textContent = m.reason
}
function render(m) {
  if (m.kind === 'state') { setState(m.state); if (m.note) add('note', m.note); return }
  if (m.kind === 'question') return renderQuestion(m)
  if (m.kind === 'question-closed') return closeQuestion(m)
  if (m.kind === 'hello') { $('ws').textContent = '工作区：' + m.workspace; setState(m.state); log.innerHTML = ''; cards.clear(); (m.history || []).forEach(render); return }
  if (m.kind === 'user') return add('user', m.text)
  if (m.kind === 'assistant') {
    let extra = null
    if (m.thinking) { extra = document.createElement('details'); const s = document.createElement('summary'); s.textContent = '思考过程'; extra.appendChild(s); extra.appendChild(document.createTextNode(m.thinking)) }
    if (m.text || extra) add('assistant', m.text || '', extra)
    return
  }
  if (m.kind === 'tool-call') return add('tool', '▶ ' + m.name + '  ' + m.args)
  if (m.kind === 'tool-result') return add(m.denied ? 'tool denied' : 'tool', (m.denied ? '✖ 越界操作被拒绝：' : '◀ ') + m.text.slice(0, 300))
  if (m.kind === 'turn-end') return add('note', '本轮结束：' + m.reason)
  if (m.kind === 'note') return add('note', m.text)
  if (m.kind === 'error') return add('error', '出错：' + m.text)
}
const es = new EventSource('/api/events')
es.onmessage = (e) => render(JSON.parse(e.data))
const post = (url, data) => fetch(url, { method: 'POST', body: data ? JSON.stringify(data) : undefined })
$('send').onclick = () => { const t = $('input').value.trim(); if (!t) return; $('input').value = ''; post('/api/prompt', { text: t }) }
$('input').onkeydown = (e) => { if (e.key === 'Enter' && e.ctrlKey) $('send').onclick() }
$('stop').onclick = () => post('/api/stop')
$('resume').onclick = () => post('/api/resume')
$('new').onclick = () => post('/api/new')
setState('stopped')
</script>
</body>
</html>
